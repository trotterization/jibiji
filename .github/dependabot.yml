version: 2
updates:
  # The only Swift package (ONNX Runtime) is vendored in Vendor/, because its
  # upstream repository is gone, so there is nothing for Dependabot to update.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
